openapi: 3.0.3
info:
  title: API каршеринга. Каталог автомобилей
  description: Фрагмент спецификации API шлюза АИС «Корпоративный каршеринг» (вариант 6).
  version: 1.0.0
servers:
  - url: https://gateway.carsharing.example
    description: Тестовый стенд
tags:
  - name: Vehicles
    description: Каталог автомобилей
paths:
  /api/v1/vehicles:
    get:
      tags:
        - Vehicles
      operationId: searchVehicles
      summary: Поиск свободных автомобилей на интервал времени
      description: Возвращает страницу автомобилей, не занятых бронью в заданном интервале.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Начало интервала (RFC 3339, UTC)
          schema:
            type: string
            format: date-time
            example: '2026-11-10T09:00:00Z'
        - name: to
          in: query
          required: true
          description: Конец интервала (RFC 3339, UTC), позже from
          schema:
            type: string
            format: date-time
            example: '2026-11-10T18:00:00Z'
        - name: class
          in: query
          required: false
          description: Класс автомобиля
          schema:
            type: string
            enum:
              - ECONOMY
              - BUSINESS
              - VAN
        - name: page
          in: query
          required: false
          description: Номер страницы, начиная с 1
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: Размер страницы
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Страница свободных автомобилей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePage'
        '400':
          description: Некорректные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Токен отсутствует или недействителен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GeoPoint:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 59.93428
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 30.3351
    Vehicle:
      type: object
      required:
        - id
        - vin
        - plateNumber
        - model
        - vehicleClass
        - status
      properties:
        id:
          type: string
          format: uuid
        vin:
          type: string
          pattern: '^[A-HJ-NPR-Z0-9]{17}$'
          example: XTA210930Y2765432
        plateNumber:
          type: string
          example: А123ВС178
        model:
          type: string
          example: Lada Vesta
        vehicleClass:
          type: string
          enum:
            - ECONOMY
            - BUSINESS
            - VAN
        status:
          type: string
          enum:
            - AVAILABLE
            - BOOKED
            - IN_TRIP
            - MAINTENANCE
        fuelLevelPct:
          type: number
          minimum: 0
          maximum: 100
          example: 63
        location:
          $ref: '#/components/schemas/GeoPoint'
    VehiclePage:
      type: object
      required:
        - items
        - page
        - size
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 37
    Error:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          example: ERROR
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        traceId:
          type: string
